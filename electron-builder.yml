appId: io.github.oduan.dy-live
productName: dy-live
directories:
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
mac:
  target:
    - dmg
  category: public.app-category.entertainment
  artifactName: ${productName}-${version}-${arch}.${ext}
# 图标：build/icon.ico（Windows）与 build/icon.icns（macOS），由 scripts/gen-icons.mjs 生成
# 修改图标：改脚本里的 SVG 后运行 npm i --no-save sharp && node scripts/gen-icons.mjs
