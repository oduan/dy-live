appId: io.github.oduan.dy-live
productName: dy-live
# 自动更新源：electron-updater 据此检查 GitHub Releases 上的 latest.yml
publish:
  provider: github
  owner: oduan
  repo: dy-live
directories:
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
# 随应用打包 ffmpeg（源流直录收尾时无损转封装 FLV→MP4，不依赖用户环境）
# 二进制不入 git（见 .gitignore），构建机上自行放入 resources/ffmpeg/
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - ffmpeg.exe
      - ffmpeg
# 压缩等级提到 lzma 最大：抵消 ffmpeg 二进制（~147MB）带来的安装包体积增长
compression: maximum
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
mac:
  target:
    - dmg
  category: public.app-category.entertainment
  artifactName: ${productName}-${version}-${arch}.${ext}
# 图标：build/icon.ico（Windows）与 build/icon.icns（macOS），由 scripts/gen-icons.mjs 生成
# 修改图标：改脚本里的 SVG 后运行 npm i --no-save sharp && node scripts/gen-icons.mjs
